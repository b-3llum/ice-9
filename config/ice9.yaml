# ice_9 configuration
# Data directory — all campaign data, evidence, and audit logs stored here
data_dir: ~/.ice9

# Where campaign tools run. Default is local; set backend: ssh to run every
# tool on a remote host you control (e.g. an AWS EC2 attack box) so scans
# originate from that instance. The remote host must have the tools installed.
# execution:
#   backend: ssh
#   host: 1.2.3.4
#   user: kali
#   port: 22
#   key_file: ~/.ssh/ice9.pem

# LLM Provider configuration
providers:
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2:3b"
    models: ["llama3.2:3b", "llama3:latest"]
  # claude:                                # metered API (needs a key)
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   model: "claude-sonnet-4-6-20250514"
  # claude_cli:                            # subscription — via the local `claude` CLI, no API key
  #   model: "sonnet"                      # sonnet | opus | haiku, or a full model id
  #   # base_url: "/path/to/claude"        # optional: override the CLI binary path
  # openai:
  #   api_key: "${OPENAI_API_KEY}"
  #   model: "gpt-4o"

# AI Agent role assignments — all using local Ollama
agents:
  coordinator:
    provider: ollama
    model: "llama3.2:3b"
    system_prompt: "You are the red team lead. Plan engagements, assign tasks to team members, and synthesize results into actionable intelligence."
  recon_analyst:
    provider: ollama
    model: "llama3.2:3b"
    system_prompt: "You analyze network scan results, OSINT data, and map attack surfaces. Identify high-value targets and potential entry points."
  exploit_researcher:
    provider: ollama
    model: "llama3.2:3b"
    system_prompt: "You research vulnerabilities, review CVEs, and suggest attack vectors. Validate findings and assess exploitability."
  report_writer:
    provider: ollama
    model: "llama3.2:3b"
    system_prompt: "You write penetration test reports. Draft findings with clear severity ratings, evidence references, and remediation guidance."
