[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ice-9"
version = "0.1.0"
description = "Red team orchestration platform — MITRE ATT&CK-aligned campaign management"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-docx>=1.0",
    "httpx>=0.25",
    "anthropic>=0.40",
    "openai>=1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "chromadb>=0.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
rag-pdf = ["pymupdf>=1.24.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ice9 = "ice_9.main:app"
tars = "ice_9.tars.server:main"
tars-repl = "ice_9.tars.repl:main"

[tool.hatch.build.targets.wheel]
packages = ["ice_9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["ice_9", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = [
    "E501",    # line length is not enforced (left to the formatter)
    "B008",    # typer.Option / fastapi.Depends in defaults is the idiomatic pattern
    "RUF012",  # phase/tool class attributes are overridden constants, not shared mutable state
    "SIM115",  # temp files are handed to subprocesses and must outlive a context manager
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "RUF015"]  # unpacking/indexing idioms that read clearly in tests
